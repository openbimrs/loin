[package]
name = "loin"
version = "0.3.2"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/loin"
readme = "README.md"
exclude = ["AGENTS.md", "PLAN.md"]
description = "ISO 7817-3 / EN 17412-3 LOIN alias: re-exports openbim-loin."
keywords = ["bim", "openbim", "aec"]
categories = ["data-structures"]

[dependencies]
# Exact pin prevents the alias and canonical package from exposing different
# versions of the same API in one dependency graph.
openbim-loin = { path = "../openbim-loin", version = "=0.3.2" }
