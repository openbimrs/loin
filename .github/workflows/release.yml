name: Release

# Tag push is the trigger because that is how releases are already cut here:
# the tag is the human decision, everything downstream follows from it.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish release and npm package
    runs-on: ubuntu-latest
    # Only `v*` tags may deploy to `release` (admins cannot bypass), and npm
    # trusts exactly this workflow file and environment.
    environment: release
    permissions:
      contents: write # gh release create
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          # Deliberately no registry-url here: setup-node would write an
          # .npmrc authToken line, which takes precedence over the OIDC
          # trusted-publishing exchange the stage step relies on.
      - name: Resolve wasm-bindgen version
        id: wb
        run: echo "version=$(python3 scripts/wasm-bindgen-version.py)" >> "$GITHUB_OUTPUT"
      - name: Install wasm-bindgen CLI
        run: |
          have="$(wasm-bindgen --version 2>/dev/null | awk '{print $2}' || true)"
          if [ "$have" != "${{ steps.wb.outputs.version }}" ]; then
            cargo install wasm-bindgen-cli \
              --version "${{ steps.wb.outputs.version }}" --locked --force
          fi

      # Refuse to publish a tag that disagrees with the manifests. Without this
      # a v0.4.0 tag would happily ship 0.3.3 to npm.
      - name: Verify tag matches manifest version
        run: python3 scripts/check-release-version.py "${GITHUB_REF_NAME}"

      # The gate must pass on the tagged commit itself, not just on the branch
      # it came from, or a release could ship code no gate ever saw.
      - name: Run verified gate
        env:
          LOIN_WASM_STRICT: '1'
        run: ./scripts/gate.sh

      - name: Build npm package
        run: python3 scripts/build-npm-package.py dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(python3 scripts/changelog-section.py "${GITHUB_REF_NAME}")"
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "$notes" \
            dist/*.tgz

      # npm trusted publishing (OIDC) replaces the long-lived NPM_TOKEN. The
      # trusted publisher on npmjs.com leaves "Allow npm publish" unchecked,
      # so this workflow can only STAGE a version; a maintainer still
      # approves it with 2FA. npm stage publish requires the package to
      # exist already, and trusted publishing needs npm >= 11.5.1, hence the
      # explicit upgrade (setup-node's bundled npm is older).
      - name: Stage npm package for approval
        id: stage
        run: |
          npm install -g npm@latest
          npm --version
          npm stage publish --access public | tee stage-output.txt
        working-directory: dist/package

      - name: Report staged package
        run: |
          echo "## npm package staged for approval" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Approve with 2FA on npmjs.com (Staged Packages tab) or:" \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "npm stage list @openbim/loin" >> "$GITHUB_STEP_SUMMARY"
          echo "npm stage approve <stage-id>" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/package/stage-output.txt >> "$GITHUB_STEP_SUMMARY" || true
