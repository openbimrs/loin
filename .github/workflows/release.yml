name: Release

# Tag push is the trigger because that is how releases are already cut here:
# the tag is the human decision, everything downstream follows from it.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish release and npm package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          # Deliberately no registry-url here: setup-node writes an .npmrc
          # with an authToken line whenever it's set, and that line is blank
          # when NPM_TOKEN is unset — better to fail loudly below than 404.
      - name: Resolve wasm-bindgen version
        id: wb
        run: echo "version=$(python3 scripts/wasm-bindgen-version.py)" >> "$GITHUB_OUTPUT"
      - name: Install wasm-bindgen CLI
        run: |
          have="$(wasm-bindgen --version 2>/dev/null | awk '{print $2}' || true)"
          if [ "$have" != "${{ steps.wb.outputs.version }}" ]; then
            cargo install wasm-bindgen-cli \
              --version "${{ steps.wb.outputs.version }}" --locked --force
          fi

      # Refuse to publish a tag that disagrees with the manifests. Without this
      # a v0.4.0 tag would happily ship 0.3.3 to npm.
      - name: Verify tag matches manifest version
        run: python3 scripts/check-release-version.py "${GITHUB_REF_NAME}"

      # The gate must pass on the tagged commit itself, not just on the branch
      # it came from, or a release could ship code no gate ever saw.
      - name: Run verified gate
        env:
          LOIN_WASM_STRICT: '1'
        run: ./scripts/gate.sh

      - name: Build npm package
        run: python3 scripts/build-npm-package.py dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(python3 scripts/changelog-section.py "${GITHUB_REF_NAME}")"
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "$notes" \
            dist/*.tgz

      # npm stage publish never needs 2FA, so the token you already have
      # ("read and write, stage only") is the right one for this — it just
      # cannot run npm publish directly, by design.
      #
      # npm stage publish requires the package to already exist on the
      # registry, so this cannot perform the very first release — that
      # needs one manual `npm publish --access public` from a maintainer.
      #
      # The registry is configured here rather than via setup-node's
      # registry-url, which writes an authToken line even when the token is
      # empty (see the Install Node step).
      #
      # `npm stage` is a recent addition; setup-node's bundled npm predates
      # it, so npm is upgraded explicitly to guarantee it's available.
      - name: Stage npm package for approval
        id: stage
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@latest
          npm --version
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is not set; cannot stage a publish." >&2
            exit 1
          fi
          npm config set //registry.npmjs.org/:_authToken="${NODE_AUTH_TOKEN}"
          npm stage publish --access public | tee stage-output.txt
        working-directory: dist/package

      - name: Report staged package
        run: |
          echo "## npm package staged for approval" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Approve with 2FA on npmjs.com (Staged Packages tab) or:" \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "npm stage list @openbim/loin" >> "$GITHUB_STEP_SUMMARY"
          echo "npm stage approve <stage-id>" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/package/stage-output.txt >> "$GITHUB_STEP_SUMMARY" || true
