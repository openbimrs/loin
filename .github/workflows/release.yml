name: Release

# Tag push is the trigger because that is how releases are already cut here:
# the tag is the human decision, everything downstream follows from it.
#
# npm uses trusted publishing (OIDC) from the `npmjs.com` environment: npm
# trusts exactly this file name (`release.yml`) and that environment, so
# renaming either breaks publishing until the package's trusted publisher on
# npmjs.com follows. The environment's required reviewer is the human
# approval step (ADR 0004); there is no npm token.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Gate, package and GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          # Deliberately no registry-url here: setup-node writes an .npmrc
          # with an authToken line whenever it's set, and that line is blank
          # when NPM_TOKEN is unset — better to fail loudly below than 404.
      - name: Resolve wasm-bindgen version
        id: wb
        run: echo "version=$(python3 scripts/wasm-bindgen-version.py)" >> "$GITHUB_OUTPUT"
      - name: Install wasm-bindgen CLI
        run: |
          have="$(wasm-bindgen --version 2>/dev/null | awk '{print $2}' || true)"
          if [ "$have" != "${{ steps.wb.outputs.version }}" ]; then
            cargo install wasm-bindgen-cli \
              --version "${{ steps.wb.outputs.version }}" --locked --force
          fi

      # Refuse to publish a tag that disagrees with the manifests. Without this
      # a v0.4.0 tag would happily ship 0.3.3 to npm.
      - name: Verify tag matches manifest version
        id: version
        run: |
          python3 scripts/check-release-version.py "${GITHUB_REF_NAME}"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The gate must pass on the tagged commit itself, not just on the branch
      # it came from, or a release could ship code no gate ever saw.
      - name: Run verified gate
        env:
          LOIN_WASM_STRICT: '1'
        run: ./scripts/gate.sh

      - name: Build npm package
        run: python3 scripts/build-npm-package.py dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(python3 scripts/changelog-section.py "${GITHUB_REF_NAME}")"
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "$notes" \
            dist/*.tgz

      - name: Upload npm tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error

  npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: npmjs.com
      url: https://www.npmjs.com/package/@openbim/loin/v/${{ needs.release.outputs.version }}
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install npm with trusted publishing
        # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
        run: npm install --global npm@^11.5.1 && npm --version
      - name: Download npm tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: dist
      - name: Publish
        # Re-running a partly failed release finishes it instead of failing
        # on a version that is already live.
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if npm view "@openbim/loin@$VERSION" version >/dev/null 2>&1; then
            echo "@openbim/loin@$VERSION is already on npm"
          else
            npm publish dist/*.tgz --access public --provenance
          fi
